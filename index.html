<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar's To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Omar's To-Do List</h1>
    <div class="input-area">
    <input id="taskInput" type="text" placeholder="What do you need to do ?">
    <button onclick="addTask()" id="addButton">Add Task</button>
    </div>
    <div class="tasks-section">    
    <h2>My Tasks</h2>
    <ul id="taskList">

    </ul>
        <button onclick="clearTasks()" id="clearButton">Clear All </button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
